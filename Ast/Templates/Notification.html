<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toggle Sections</title>
  <style>
    .button-container {
      display: flex;
      gap: 5px;
    }

    button {
      padding: 10px;
      cursor: pointer;
      border: 1px solid #007bff;
      border-radius: 5px;
      background-color: white;
      font-size: 16px;
    }

    .content {
      display: none;
      margin-top: 5px;
      padding: 10px;
      border: 1px solid #007bff;
      border-radius: 5px;
      background-color: #f0f8ff;
    }
  </style>
</head>
<body>

<div class="button-container">
  <button onclick="toggleContent('report')">View Reports</button>
  <button onclick="toggleContent('notification')">View Notification</button>
  <button onclick="toggleContent('attendance')">View Attendance</button>
</div>

<div id="report" class="content">📊 This is the report section content.</div>
<div id="notification" class="content">🔔 This is the notification section content.</div>
<div id="attendance" class="content">📅 This is the attendance section content.</div>

<script>
  function toggleContent(id) {
    const sections = ['report', 'notification', 'attendance'];

    sections.forEach(sectionId => {
      const section = document.getElementById(sectionId);
      if (sectionId === id) {
        section.style.display = section.style.display === 'block' ? 'none' : 'block';
      } else {
        section.style.display = 'none';
      }
    });
  }
</script>

</body>
</html>
